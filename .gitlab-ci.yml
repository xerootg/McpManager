stages:
  - build
  - deploy

variables:
  IMAGE_TAG: $CI_REGISTRY_IMAGE:latest
  DOCKER_DRIVER: overlay2

build-image:
  stage: build
  image: docker:27
  # No services: here — the runner's config template injects docker:27-dind
  # (unix socket on a shared /var/run, --mtu=1450). Declaring dind again spawns
  # a second daemon in the same pod netns; the two race on iptables chain
  # setup and both crash. See pipeline #763.
  before_script:
    - until docker info; do sleep 1; done
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    # --network=host makes BuildKit's RUN steps use the runner pod's eth0 (flannel
    # overlay, MTU 1450 with MSS clamping) instead of BuildKit's own 1500-MTU
    # sandbox bridge — which BuildKit does NOT inherit from `dockerd --mtu`. Without
    # it, large egress (dotnet restore from api.nuget.org) is blackholed and the job
    # times out. See pipeline #618.
    - docker build --network=host -t "$IMAGE_TAG" .
    - docker push "$IMAGE_TAG"
  only:
    - main

deploy:
  stage: deploy
  # Runs in-cluster as the gitlab/default ServiceAccount; argo-things grants it
  # get/watch/patch on deployment/mcpmanager only (configs/mcpmanager/
  # ci-deploy-rbac.yaml). Bumping the CI-owned image-commit annotation changes
  # the pod template, which re-pulls :latest (imagePullPolicy: Always). The
  # ArgoCD Application ignores this annotation so selfHeal won't revert it.
  image: alpine/k8s:1.33.4
  variables:
    GIT_STRATEGY: none
  script:
    - kubectl -n mcpmanager patch deployment mcpmanager --type merge -p "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"mcpmanager.themissing.xyz/image-commit\":\"$CI_COMMIT_SHORT_SHA\"}}}}}"
    - kubectl -n mcpmanager rollout status deployment/mcpmanager --timeout=300s
  only:
    - main
